[build]
  publish = "dist"

# This is a static website. No build command or server functions are required.
# Publish only dist/; the paid toolkit archive in the repository root stays out.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
